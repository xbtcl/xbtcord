name: Build

on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - installer/**
            - assets/**
            - package.json
            - pnpm-lock.yaml
    workflow_dispatch:

env:
    FORCE_COLOR: true

# Two builds have to meet before anything is published: the client bundle on Linux and the
# installer exe on Windows. They are independent, so they run at the same time.
jobs:
    client:
        name: Client bundle
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build --standalone

            - name: Generate plugin list
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            # Source maps are ~11 MB of the ~14 MB dist and nothing that installs from a
            # release ever reads them.
            - name: Drop source maps and scratch output
              run: rm -rf dist/*.map dist/*-unpacked dist/vendor

            - uses: actions/upload-artifact@v4
              with:
                  name: client
                  path: dist/
                  retention-days: 7

    installer:
        name: Installer
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7

            - uses: ilammy/msvc-dev-cmd@v1

            # XBT_REPO is baked in from the repository this is running in, so the exe a fork
            # produces downloads that fork's releases without anyone editing a constant.
            - name: Build the installer
              shell: pwsh
              run: ./installer/build.ps1 -Repo "${{ github.repository }}" -Toolchain msvc

            - uses: actions/upload-artifact@v4
              with:
                  name: installer
                  path: installer/build/XbtcordInstaller.exe
                  retention-days: 7

    release:
        name: Publish
        runs-on: ubuntu-latest
        needs: [client, installer]
        # A fork's PR has no write token, and there is nowhere sensible to publish to anyway.
        if: github.event_name != 'pull_request'
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v4
              with:
                  name: client
                  path: release

            - uses: actions/download-artifact@v4
              with:
                  name: installer
                  path: release

            - name: Publish the rolling build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  short="$(git rev-parse --short HEAD)"

                  # A single moving "latest" release, so the installer always has a stable
                  # URL to fetch from. --clobber replaces the assets in place.
                  gh release create latest \
                      --title "Latest build" \
                      --notes "Rolling build of the main branch." \
                      --latest \
                      || true

                  gh release upload latest --clobber release/*
                  gh release edit latest \
                      --title "Latest build ($short)" \
                      --notes "Rolling build of \`main\`, from commit $short.

                  Download **XbtcordInstaller.exe** and run it. No admin rights needed."
